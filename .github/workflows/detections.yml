# Layer A detection behaviour tests: runs each rule's real SPL against its
# fixtures in an ephemeral Splunk container.
#
# Deliberately a separate workflow from ci.yml. The README's CI badge reflects
# ci.yml alone, so a slow or flaky multi-GB Splunk container can never red it.
# The metadata tests (layer C) run in ci.yml's test matrix on every push.
name: Detection behaviour tests

on:
  push:
    branches: [main]
    paths:
      - projects/defensive/splunk/detections/**
      - .github/workflows/detections.yml
      - pyproject.toml
  pull_request:
    paths:
      - projects/defensive/splunk/detections/**
      - .github/workflows/detections.yml
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: detections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detection-tests:
    name: Detection behaviour tests
    runs-on: ubuntu-latest
    # Bounds a stalled image pull; a normal run is the pull plus the harness's
    # own bounded waits (600s readiness, 60s ingest, 120s per search).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/defensive/splunk/detections/requirements-dev.txt

      - name: Install dependencies
        working-directory: projects/defensive/splunk/detections
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute detections against ephemeral Splunk
        working-directory: projects/defensive/splunk/detections
        run: python -m pytest -m docker -v
