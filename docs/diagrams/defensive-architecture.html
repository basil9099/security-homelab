<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Defensive Lab Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --plate:  #1c2128;
      --ink:    #e6e9ee;
      --muted:  #8792a3;
      --accent: #3ddc84;
      --font-sans: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: #0d1117;
      color: var(--ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--ink); margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Defensive Lab Architecture</h1>

    <svg viewBox="0 0 960 384" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="defensive-architecture-title defensive-architecture-desc">
      <title id="defensive-architecture-title">Defensive Lab Architecture</title>
      <desc id="defensive-architecture-desc">Simulated adversary tooling feeds perimeter and endpoint sensors, which forward telemetry to Splunk; only the Windows Server Sysmon feed is implemented today, the other three flows are illustrative.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8792a3"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3ddc84"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#1c2128"/>

      <!-- zones (painted first) -->
      <rect x="40" y="40" width="240" height="212" rx="8" fill="rgba(230,233,238,0.03)" stroke="rgba(230,233,238,0.10)" stroke-width="0.8"/>
      <rect x="56" y="44" width="112" height="12" rx="2" fill="#1c2128"/>
      <text x="112" y="53" fill="rgba(230,233,238,0.40)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ADVERSARY SIMULATION</text>

      <rect x="352" y="40" width="240" height="212" rx="8" fill="rgba(230,233,238,0.03)" stroke="rgba(230,233,238,0.10)" stroke-width="0.8"/>
      <rect x="368" y="44" width="56" height="12" rx="2" fill="#1c2128"/>
      <text x="396" y="53" fill="rgba(230,233,238,0.40)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">INGESTION</text>

      <rect x="664" y="40" width="240" height="212" rx="8" fill="rgba(230,233,238,0.03)" stroke="rgba(230,233,238,0.10)" stroke-width="0.8"/>
      <rect x="680" y="44" width="56" height="12" rx="2" fill="#1c2128"/>
      <text x="708" y="53" fill="rgba(230,233,238,0.40)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.14em">DETECTION</text>

      <!-- arrows (drawn before boxes) -->
      <line x1="260" y1="104" x2="372" y2="104" stroke="#8792a3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="296" y="84" width="40" height="12" rx="2" fill="#1c2128"/>
      <text x="316" y="93" fill="#8792a3" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROBES</text>

      <path d="M 572,104 H 620 Q 628,104 628,112 V 124 Q 628,132 636,132 H 684" fill="none" stroke="#8792a3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="638" y="112" width="40" height="12" rx="2" fill="#1c2128"/>
      <text x="658" y="121" fill="#8792a3" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ALERTS</text>

      <path d="M 572,200 H 620 Q 628,200 628,192 V 180 Q 628,172 636,172 H 684" fill="none" stroke="#3ddc84" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="638" y="180" width="40" height="12" rx="2" fill="#1c2128"/>
      <text x="658" y="189" fill="#3ddc84" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYSMON</text>

      <path d="M 160,232 V 276 Q 160,284 168,284 H 776 Q 784,284 784,276 V 208" fill="none" stroke="#8792a3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="396" y="264" width="48" height="12" rx="2" fill="#1c2128"/>
      <text x="420" y="273" fill="#8792a3" font-size="8" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSIONS</text>

      <!-- nodes -->
      <rect x="60" y="72" width="200" height="64" rx="6" fill="#1c2128"/>
      <rect x="60" y="72" width="200" height="64" rx="6" fill="rgba(135,146,163,0.10)" stroke="#7d8899" stroke-width="1"/>
      <rect x="68" y="80" width="44" height="12" rx="2" fill="none" stroke="rgba(125,136,153,0.40)" stroke-width="0.8"/>
      <text x="90" y="89" fill="rgba(125,136,153,0.90)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OFFSEC</text>
      <text x="160" y="110" fill="#e6e9ee" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Vulnerability Scanner</text>
      <text x="160" y="126" fill="#8792a3" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">port + service probes</text>

      <rect x="60" y="168" width="200" height="64" rx="6" fill="#1c2128"/>
      <rect x="60" y="168" width="200" height="64" rx="6" fill="rgba(135,146,163,0.10)" stroke="#7d8899" stroke-width="1"/>
      <rect x="68" y="176" width="44" height="12" rx="2" fill="none" stroke="rgba(125,136,153,0.40)" stroke-width="0.8"/>
      <text x="90" y="185" fill="rgba(125,136,153,0.90)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OFFSEC</text>
      <text x="160" y="206" fill="#e6e9ee" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Honeypot</text>
      <text x="160" y="222" fill="#8792a3" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">ssh · http · ftp · telnet</text>

      <rect x="372" y="72" width="200" height="64" rx="6" fill="#1c2128"/>
      <rect x="372" y="72" width="200" height="64" rx="6" fill="#262c36" stroke="#e6e9ee" stroke-width="1"/>
      <rect x="380" y="80" width="40" height="12" rx="2" fill="none" stroke="rgba(230,233,238,0.40)" stroke-width="0.8"/>
      <text x="400" y="89" fill="rgba(230,233,238,0.80)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PERIM</text>
      <text x="472" y="110" fill="#e6e9ee" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">pfSense</text>
      <text x="472" y="126" fill="#8792a3" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">firewall + suricata ids</text>

      <rect x="372" y="168" width="200" height="64" rx="6" fill="#1c2128"/>
      <rect x="372" y="168" width="200" height="64" rx="6" fill="#262c36" stroke="#e6e9ee" stroke-width="1"/>
      <rect x="380" y="176" width="40" height="12" rx="2" fill="none" stroke="rgba(230,233,238,0.40)" stroke-width="0.8"/>
      <text x="400" y="185" fill="rgba(230,233,238,0.80)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENDPT</text>
      <text x="472" y="206" fill="#e6e9ee" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Windows Server + AD</text>
      <text x="472" y="222" fill="#8792a3" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">sysmon · security log</text>

      <rect x="684" y="96" width="200" height="112" rx="6" fill="#1c2128"/>
      <rect x="684" y="96" width="200" height="112" rx="6" fill="rgba(61,220,132,0.10)" stroke="#3ddc84" stroke-width="1"/>
      <rect x="692" y="104" width="32" height="12" rx="2" fill="none" stroke="rgba(61,220,132,0.40)" stroke-width="0.8"/>
      <text x="708" y="113" fill="rgba(61,220,132,0.90)" font-size="7" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SIEM</text>
      <text x="784" y="156" fill="#e6e9ee" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Splunk</text>
      <text x="784" y="176" fill="#8792a3" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">detection content</text>
      <text x="784" y="192" fill="#8792a3" font-size="9" font-family="'JetBrains Mono', monospace" text-anchor="middle">+ dashboards</text>

      <!-- legend -->
      <line x1="40" y1="324" x2="920" y2="324" stroke="rgba(230,233,238,0.10)" stroke-width="0.8"/>
      <text x="40" y="348" fill="#8792a3" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="136" y1="344" x2="164" y2="344" stroke="#3ddc84" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="180" y="348" fill="#8792a3" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">IMPLEMENTED</text>

      <line x1="336" y1="344" x2="364" y2="344" stroke="#8792a3" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="380" y="348" fill="#8792a3" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">ILLUSTRATIVE</text>

      <rect x="584" y="336" width="16" height="12" rx="2" fill="rgba(61,220,132,0.10)" stroke="#3ddc84" stroke-width="0.8"/>
      <text x="612" y="348" fill="#8792a3" font-size="8" font-family="'JetBrains Mono', monospace" letter-spacing="0.06em">DETECTION SINK</text>
    </svg>
  </div>
</body>
</html>
