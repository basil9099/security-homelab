---
all:
  children:
    pfsense:
      hosts:
        pfsense.lab.local:
          ansible_host: 10.10.10.1
          ansible_user: admin
          ansible_connection: ansible.netcommon.network_cli
          ansible_network_os: pfsensible.core.pfsense
          # No ansible_python_interpreter: the network_cli connection runs modules
          # on the control node, so a managed-host interpreter path has no effect.
          # Key-based auth is assumed — enable SSH + "Authorized keys only" in the WebGUI first.
          ansible_ssh_private_key_file: ~/.ssh/homelab_pfsense_ed25519
