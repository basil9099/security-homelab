---
all:
  children:
    pfsense:
      hosts:
        pfsense.lab.local:
          ansible_host: 10.10.10.1
          ansible_user: admin
          ansible_connection: ansible.netcommon.network_cli
          ansible_network_os: pfsensible.core.pfsense
          ansible_python_interpreter: /usr/local/bin/python3.11
          # Key-based auth is assumed — enable SSH + "Authorized keys only" in the WebGUI first.
          ansible_ssh_private_key_file: ~/.ssh/homelab_pfsense_ed25519
