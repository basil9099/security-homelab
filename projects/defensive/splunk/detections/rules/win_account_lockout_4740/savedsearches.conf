# Alert configuration for win_account_lockout_4740.
# search.spl is the source of truth; the parity test fails on drift.

[Homelab - Password Spraying via Lockouts (T1110.003)]
search = index=wineventlog (source="XmlWinEventLog:Security" OR sourcetype="XmlWinEventLog:Security") EventCode=4740 \
| bucket _time span=1h \
| stats dc(TargetUserName) AS accounts_locked, values(TargetUserName) AS locked_accounts BY _time, TargetDomainName \
| where accounts_locked >= 3
description = Three or more distinct accounts locked out from one caller within an hour.
cron_schedule = 5 * * * *
dispatch.earliest_time = -75m@m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 5
alert.suppress = 1
alert.suppress.fields = TargetDomainName
alert.suppress.period = 4h
action.email = 0
