# Alert configuration for win_bruteforce_smb_4625.
# The search body is the single source of truth in search.spl; the parity test
# in tests/test_metadata.py fails if these two drift apart.

[Homelab - SMB Brute-Force (T1110.001)]
search = index=wineventlog (source="XmlWinEventLog:Security" OR sourcetype="XmlWinEventLog:Security") EventCode=4625 LogonType=3 \
| bucket _time span=15m \
| stats count AS failure_count, dc(TargetUserName) AS distinct_accounts, values(TargetUserName) AS targeted_accounts BY _time, IpAddress \
| where failure_count >= 5
description = Five or more failed SMB network logons from one source inside 15 minutes.
cron_schedule = */15 * * * *
dispatch.earliest_time = -20m@m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = IpAddress
alert.suppress.period = 60m
action.email = 0
