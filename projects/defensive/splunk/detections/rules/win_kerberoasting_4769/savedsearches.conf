# Alert configuration for win_kerberoasting_4769.
# search.spl is the source of truth; the parity test fails on drift.

[Homelab - Kerberoasting (T1558.003)]
search = index=wineventlog (source="XmlWinEventLog:Security" OR sourcetype="XmlWinEventLog:Security") EventCode=4769 TicketEncryptionType="0x17" TicketOptions="0x40810000" Status="0x0" \
| where NOT match(ServiceName, "\$$") AND ServiceName!="krbtgt" \
| bucket _time span=10m \
| stats dc(ServiceName) AS services_requested, values(ServiceName) AS services BY _time, TargetUserName, IpAddress \
| where services_requested >= 5
description = One principal requesting RC4 service tickets for five or more distinct SPNs in ten minutes.
cron_schedule = */10 * * * *
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 6
alert.suppress = 1
alert.suppress.fields = TargetUserName
alert.suppress.period = 2h
action.email = 0
