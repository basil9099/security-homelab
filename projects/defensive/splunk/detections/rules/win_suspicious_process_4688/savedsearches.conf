# Alert configuration for win_suspicious_process_4688.
# search.spl is the source of truth; the parity test fails on drift.
#
# NOTE: requires ProcessCreationIncludeCmdLine_Enabled=1 on the endpoint. See
# the prerequisites field in detection.yml.

[Homelab - Suspicious PowerShell Invocation (T1059.001)]
search = index=wineventlog (source="XmlWinEventLog:Security" OR sourcetype="XmlWinEventLog:Security") EventCode=4688 (NewProcessName="*\\powershell.exe" OR NewProcessName="*\\pwsh.exe") \
| where match(CommandLine, "(?i)\s-e(nc|ncoded|ncodedcommand)?\s") OR match(CommandLine, "(?i)-w(indowstyle)?\s+hidden") OR match(CommandLine, "(?i)(FromBase64String|IEX|Invoke-Expression|DownloadString)") \
| table _time, Computer, SubjectUserName, ParentProcessName, NewProcessName, CommandLine
description = PowerShell started with an encoded command, a hidden window, or a download cradle.
cron_schedule = */5 * * * *
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.severity = 6
alert.suppress = 1
alert.suppress.fields = Computer,SubjectUserName
alert.suppress.period = 30m
action.email = 0
