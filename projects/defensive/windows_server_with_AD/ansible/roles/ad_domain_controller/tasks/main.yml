---
- name: Install AD Domain Services + management tools
  ansible.windows.win_feature:
    name:
      - AD-Domain-Services
      - RSAT-AD-Tools
      - RSAT-ADDS
      - GPMC
    include_management_tools: true
    state: present
  register: addc_feature

- name: Promote to first DC in new forest
  microsoft.ad.domain:
    dns_domain_name: "{{ domain_name }}"
    domain_netbios_name: "{{ domain_netbios_name }}"
    safe_mode_password: "{{ vault_domain_safe_mode_password }}"
    reboot: true

- name: Wait for AD web services to come back after promotion
  ansible.windows.win_service:
    name: ADWS
    state: started
  retries: 10
  delay: 15
  register: adws_service
  until: adws_service is succeeded
