# Repo-wide tooling configuration for the cybersecurity-homelab monorepo.
#
# This repo is a collection of independent security tools and labs, each with
# its own `requirements.txt`. There is intentionally no packaging metadata here
# (no [build-system] / [project]) — this file exists only to give ruff and
# pytest a single, shared source of truth across every project.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pyflakes (F) + a pragmatic slice of pycodestyle (E4/E7/E9), import sorting (I),
# pyupgrade (UP), and flake8-bugbear (B). E501 (line-too-long) is deliberately
# left out: line length is handled by the formatter, which does not force-wrap
# long strings/URLs, so gating on E501 produces noise without value.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# `__init__.py` files re-export their package's public API; those imports are
# intentional even though they look "unused" to Pyflakes.
"**/__init__.py" = ["F401"]

[tool.ruff.format]
# Ruff's defaults (Black-compatible). Available via pre-commit for contributors.

[tool.pytest.ini_options]
# Each project owns its own `tests/` directory and an empty conftest.py at its
# root, whose presence puts that root on sys.path, so tests are always run from
# within a project (`cd projects/<area>/<project> && pytest`). This block only
# sets shared defaults; it does not collect tests across projects (their many
# identically named modules — main.py, config.py, models.py — would collide).
addopts = "-ra"
python_files = ["test_*.py"]
python_functions = ["test_*"]
